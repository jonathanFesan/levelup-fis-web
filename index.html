<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LevelUp Fís</title>
  <meta name="description" content="LevelUp Fís — plataforma gamificada de ensino de Física. Seu progresso é o mesmo do app.">
  <meta name="theme-color" content="#0E1A40">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Fundo já escuro enquanto o CSS carrega (evita piscar branco) -->
  <style>html,body{background:#0E1A40;margin:0}</style>
</head>
<body>
  <script>
    // Se o site não montar (ex.: navegador misturou arquivos de versões
    // diferentes do cache), mostra um botão de atualizar em vez da tela vazia.
    window.lupFalha = function () {
      var a = document.getElementById('app');
      if (!a || a.getAttribute('data-falha')) return;
      a.setAttribute('data-falha', '1');
      a.innerHTML = '<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;font-family:Nunito,sans-serif;color:#FCF3C8">' +
        '<b style="font-size:20px">O site foi atualizado</b><span style="color:#7C84B8">Toque no botão para carregar a versão nova.</span>' +
        '<button onclick="location.reload()" style="padding:14px 22px;border:0;border-radius:14px;font-weight:800;font-size:15px;background:#FFC65C;color:#0E1A40;cursor:pointer">Atualizar página</button></div>';
    };
    window.addEventListener('error', function () {
      setTimeout(function () { var a = document.getElementById('app'); if (a && !a.children.length) window.lupFalha(); }, 2500);
    }, true);
  </script>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div id="wake-banner" class="wake-banner" hidden>
    <span class="spinner small"></span>
    Acordando o servidor… isso pode levar até 1 minuto no primeiro acesso.
  </div>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- Carregador: este index.html NÃO muda entre versões. O navegador às vezes
       reaproveita um index.html velho do cache (ex.: ao reabrir o navegador),
       então a versão vem do versao.json, buscado sempre sem cache. Ao publicar,
       troque só o "v" em versao.json. -->
  <script>
    (function () {
      var ARQS = [
        'css/style.css', 'css/cartoes.css',
        'js/config.js', 'js/api.js', 'js/plus.js',
        // Resumo/Curiosidade em cartões: DOMPurify limpa o texto rico que vem do painel
        'https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js',
        'js/cartoes.js', 'js/app.js'
      ];
      function carregar(v) {
        ARQS.forEach(function (src) {
          var url = /^https?:/.test(src) ? src : src + '?v=' + encodeURIComponent(v);
          if (/\.css$/.test(src)) {
            var l = document.createElement('link');
            l.rel = 'stylesheet'; l.href = url;
            document.head.appendChild(l);
          } else {
            var s = document.createElement('script');
            s.src = url; s.async = false; // mantém a ordem de execução
            if (!/^https?:/.test(src)) s.onerror = function () { window.lupFalha(); }; // DOMPurify é opcional
            document.body.appendChild(s);
          }
        });
      }
      var ok = false;
      // Sem resposta em 6 s (ou sem internet): carrega com uma versão única,
      // que nunca está no cache — mais lento, mas sempre consistente.
      var t = setTimeout(function () { if (!ok) { ok = true; carregar('t' + Date.now()); } }, 6000);
      fetch('versao.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (!ok) { ok = true; clearTimeout(t); carregar(d.v || ('t' + Date.now())); } })
        .catch(function () { if (!ok) { ok = true; clearTimeout(t); carregar('t' + Date.now()); } });
    })();
  </script>
</body>
</html>
